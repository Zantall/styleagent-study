<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StyleAgent 提交连通性测试</title>
<style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,sans-serif;background:#f5f7fa;color:#182338;margin:0;padding:24px}main{max-width:640px;margin:32px auto;background:white;padding:28px;border-radius:18px;border:1px solid #e3e8f0}h1{font-size:24px;line-height:1.4}p{color:#526177}label{display:flex;align-items:center;justify-content:space-between;margin:18px 0;gap:14px}select{padding:10px;font-size:16px;min-width:100px;border:1px solid #bbc5d3;border-radius:8px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#166bdb;color:white;font-size:17px;cursor:pointer}button:disabled{opacity:.6}#result{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#f1f5fb;border-radius:10px;margin-top:20px}.ok{color:#06713b}.error{color:#b32424}small{color:#68758a}a{color:#166bdb}</style></head><body><main>
<h1>StyleAgent 提交连通性测试</h1>
<p>这是测试页，不是正式问卷。任选三个分数后提交，验证当前网络能否把评分存入数据库。测试评分不会计入研究结果。</p>
<p>请用手机移动网络、关闭代理后测试；也可以再用日常 Wi-Fi 测一次。页面能打开和提交成功是两项不同的检查。</p>
<form id="probe"><label>风格一致性<select name="style_score" aria-label="风格一致性"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><label>语义一致性<select name="semantic_score" aria-label="语义一致性"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><label>美观程度<select name="aesthetic_score" aria-label="美观程度"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><button id="submit" type="submit">测试提交</button></form>
<div id="result" role="status" aria-live="polite">页面已打开，尚未提交。</div>
<p><small>只保存随机测试编号、三个测试分数和提交时间。无需姓名、手机号或登录。测试编号可用于核对入库。</small></p>
</main><script>
const endpoint="https://byxdpuslqeqppqosjexw.supabase.co/rest/v1/connectivity_probe";
const publishKey="sb_publishable_YZn0VPpikzc_TegAR7UjlQ_g1-TD8qU";
document.getElementById('probe').addEventListener('submit',async event=>{
event.preventDefault();const button=document.getElementById('submit'),result=document.getElementById('result');
button.disabled=true;result.className='';result.textContent='正在提交，请稍候…';
const id=crypto.randomUUID(),data=Object.fromEntries(new FormData(event.target));for(const k of Object.keys(data))data[k]=Number(data[k]);
const started=performance.now(),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
try{const r=await fetch(endpoint,{method:'POST',headers:{apikey:publishKey,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({id,...data}),signal:controller.signal});
if(!r.ok){const detail=await r.json().catch(()=>({}));throw new Error('HTTP '+r.status+(detail.code?' / '+detail.code:''));}
result.className='ok';result.textContent='提交成功：数据库已接受测试评分。\n用时：'+Math.round(performance.now()-started)+' ms\n测试编号：'+id+'\n请把测试编号和所用网络告诉我，便于核对。';
}catch(e){result.className='error';result.textContent='提交未确认成功：'+(e.name==='AbortError'?'20 秒内未收到响应':e.message)+'\n测试编号：'+id+'\n请保留此编号，超时不一定意味着没有入库。';}
finally{clearTimeout(timer);button.disabled=false;}
});
</script></body></html>
